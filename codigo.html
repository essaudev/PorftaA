<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
      }

      pre {
        margin: 0;
        background: #020817;
        color: #dbeafe;
        padding: 16px;
        border-radius: 10px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Tu código</h1>
        <pre>
Pega tu código aquí
        </pre>
      </div>
    </div>
  </body>
</html>
